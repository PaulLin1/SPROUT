[project]
name = "sprout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Lin", email = "plin5166@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "faiss-cpu>=1.13.0",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "torch>=2.8.0",
    "transformers>=4.57.6",
]

[project.scripts]
sprout = "sprout:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
